name: Quality and builds
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure Veldigo platform assets
        run: |
          python tools/configure_android.py
          python tools/generate_brand_icons.py
          flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - name: Strict visual comparison regression tests
        run: |
          python -m pip install Pillow
          python tools/test_visual_parity_audit.py
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: veldigo-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure Veldigo platform assets
        run: |
          python tools/configure_android.py
          python tools/generate_brand_icons.py
          flutter pub get
      - run: flutter build windows --debug
      - uses: actions/upload-artifact@v4
        with:
          name: veldigo-windows-debug
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error
